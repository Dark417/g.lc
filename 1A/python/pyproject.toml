[project]
name = "a"
version = "0.1.0"
description = "1A AI knowledge showcase: one slice per AWS GenAI component (FastAPI + boto3)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "boto3>=1.40",
  "opensearch-py>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
