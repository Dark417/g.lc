[project]
name = "x"
version = "0.1.0"
description = "1x knowledge showcase: one slice per component (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.3",  # callable kwargs: fresh IAM token per new connection
  "confluent-kafka>=2.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
